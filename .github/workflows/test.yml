name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # マイグレーションの生成漏れを検出する（#236）。
      # ローカルもCIも `prisma db push` で schema.prisma を直接反映するため、
      # マイグレーションを作り忘れてもここまでは通ってしまう。一方で本番は
      # `prisma migrate deploy` しか実行しないため、履歴に無いテーブルは本番DBにだけ
      # 作られず、画面を開いた時点で "The table X does not exist" になる。
      # `prisma/migrations` だけで schema.prisma を再現できるかをシャドウDBで確認する
      # （差分があると終了コード 2 で失敗する）。db push でスキーマを入れる前に実行する。
      - name: Migration drift check
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url mysql://root@127.0.0.1:3306/test_db \
            --exit-code
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db

      - name: Database schema sync
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db

      - name: Build check
        run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db
