name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      # マイグレーションの生成漏れを検出する（#236）。
      # ローカルもCIも `prisma db push` で schema.prisma を直接反映するため、
      # マイグレーションを作り忘れてもここまでは通ってしまう。一方で本番は
      # `prisma migrate deploy` しか実行しないため、履歴に無いテーブルは本番DBにだけ
      # 作られず、画面を開いた時点で "The table X does not exist" になる。
      # `prisma/migrations` だけで schema.prisma を再現できるかをシャドウDBで確認する
      # （差分があると終了コード 2 で失敗する）。db push でスキーマを入れる前に実行する。
      - name: Migration drift check
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url mysql://root@127.0.0.1:3306/test_db \
            --exit-code
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db

      - name: Database schema sync
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db

      - name: Build check
        run: npm run build
        env:
          DATABASE_URL: mysql://root@127.0.0.1:3306/test_db

  notify:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          test="${{ needs.test.result }}"
          if [ "$test" = "success" ]; then
            result=success
          elif [ "$test" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$test" = "success" ]; then
            echo "jobs=test" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=test: $test" >> "$GITHUB_OUTPUT"
          fi
          # develop push: failure only. main PR: success, failure, and cancelled.
          if [ "$result" = "failure" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaly に通知
        if: steps.status.outputs.should_notify == 'true'
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: Asset Manager
          NOTIFY_KIND: CI
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB: ${{ steps.status.outputs.jobs }}
        run: bash .github/scripts/signaly-notify.sh
