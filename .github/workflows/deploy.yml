name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
      AIDE_READ_SECRET: ${{ secrets.AIDE_READ_SECRET }}
      ZAIM_SYNC_SECRET: ${{ secrets.AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET }}
      SALARY_AGENT_SECRET: ${{ secrets.SALARY_AGENT_SECRET }}
      SALARY_AGENT_USER_EMAIL: ${{ secrets.SALARY_AGENT_USER_EMAIL }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Clean previous build artifacts
        run: rm -rf .next

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz package.json package-lock.json public .next prisma next.config.mjs scripts lib tsconfig.json ecosystem.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
      AIDE_READ_SECRET: ${{ secrets.AIDE_READ_SECRET }}
      ZAIM_SYNC_SECRET: ${{ secrets.AIDE_ASSET_MANAGER_ZAIM_SYNC_SECRET }}
      SALARY_AGENT_SECRET: ${{ secrets.SALARY_AGENT_SECRET }}
      SALARY_AGENT_USER_EMAIL: ${{ secrets.SALARY_AGENT_USER_EMAIL }}
      OPS_API_TOKEN: ${{ secrets.OPS_API_TOKEN }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      MEISAI_LAB_CUTOVER: ${{ vars.MEISAI_LAB_CUTOVER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: "just-a-placeholder-so-we-dont-get-errors"
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275）へ渡す**（#754）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名（置き場
      # /home/github-user/apps/asset-manager の名前）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deployの3語だけが通る。旧配布物の削除・展開・.env更新・npm ci --omit=dev・
      # prisma migrate deploy・pm2の再起動（ecosystem.config.js が宣言する asset-manager と
      # cron の3プロセス）・稼働版の照合はgate側が行う（guchi-apps/vps#298・#300）。
      #
      # Prisma CLI は devDependencies にあるが、@prisma/client の peerDependency として本番用の
      # 依存（npm ci --omit=dev）にも入り、その postinstall が Prisma Client を生成する。
      # 従来 SSH 先で叩いていた `npx prisma generate` はそのため不要になった。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < deploy.tar.gz

      - name: Send environment variables
        env:
          # 稼働中の版の照合に使う（#754）。gateが.envのAPP_COMMIT_SHAと稼働中の/api/app-versionの
          # shaを照合する（guchi-apps/vps#298）。コミットのSHAは公開情報なのでそのまま渡してよい
          APP_COMMIT_SHA: ${{ github.sha }}
          # マイグレーション専用ユーザー（DDL権限あり）。gateは.envへ書かずマイグレーションだけに使う。
          # 未設定の環境では通常ユーザーへフォールバックする
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ env.NEXT_PUBLIC_GA_ID }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ env.DISCORD_ALERT_WEBHOOK_URL }}
          AIDE_READ_SECRET: ${{ env.AIDE_READ_SECRET }}
          ZAIM_SYNC_SECRET: ${{ env.ZAIM_SYNC_SECRET }}
          SALARY_AGENT_SECRET: ${{ env.SALARY_AGENT_SECRET }}
          SALARY_AGENT_USER_EMAIL: ${{ env.SALARY_AGENT_USER_EMAIL }}
          OPS_API_TOKEN: ${{ env.OPS_API_TOKEN }}
          SHARED_TOKEN_API_SECRET: ${{ env.SHARED_TOKEN_API_SECRET }}
          ISSUE_DECK_URL: ${{ env.ISSUE_DECK_URL }}
          MEISAI_LAB_CUTOVER: ${{ env.MEISAI_LAB_CUTOVER }}
        run: |
          set -euo pipefail
          # gateは標準入力を1行1変数（KEY=VALUE）で受けるため、改行を含む値は送れない。
          for name in APP_COMMIT_SHA MIGRATE_DATABASE_URL DATABASE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_GA_ID DISCORD_ALERT_WEBHOOK_URL AIDE_READ_SECRET ZAIM_SYNC_SECRET SALARY_AGENT_SECRET SALARY_AGENT_USER_EMAIL OPS_API_TOKEN SHARED_TOKEN_API_SECRET ISSUE_DECK_URL MEISAI_LAB_CUTOVER; do
            case "${!name:-}" in
              *$'\n'*) echo "::error::${name} が改行を含むためgateへ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ（ecosystem.config.js の既定と同じ 3102）。
          {
            printf '%s\n' "NODE_ENV=production" "PORT=3102"
            # 今回デプロイしたコミット。`/api/app-version` がこの値を返し、gateが照合する（#754）。
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL:-$DATABASE_URL}"
            printf '%s\n' "DATABASE_URL=${DATABASE_URL:-}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}"
            printf '%s\n' "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
            printf '%s\n' "NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}"
            printf '%s\n' "DISCORD_ALERT_WEBHOOK_URL=${DISCORD_ALERT_WEBHOOK_URL:-}"
            # Zaimの残高はAIDEの読み取りAPIから受け取る（#191）。
            printf '%s\n' "AIDE_READ_SECRET=${AIDE_READ_SECRET:-}"
            # 請求情報取込はAIDE側と同じBearer認証用シークレットを使う（#295）。
            printf '%s\n' "ZAIM_SYNC_SECRET=${ZAIM_SYNC_SECRET:-}"
            # 給与明細の代理登録API（#791）のBearer認証と、登録先ユーザーのメール。ZAIM_SYNC_SECRETとは別の値。
            printf '%s\n' "SALARY_AGENT_SECRET=${SALARY_AGENT_SECRET:-}"
            printf '%s\n' "SALARY_AGENT_USER_EMAIL=${SALARY_AGENT_USER_EMAIL:-}"
            # ops-dashboardがAI使用量（GET /api/ai-usage）を読むためのBearer認証（#535）。
            printf '%s\n' "OPS_API_TOKEN=${OPS_API_TOKEN:-}"
            # 認証値は共有トークンAPIから実行時に取得する（#603）。取れなければ上の値へフォールバックする。
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET:-}"
            printf '%s\n' "ISSUE_DECK_URL=${ISSUE_DECK_URL:-}"
            # 明細ラボからの切替が完了するまで、移した画面・書き込みを閉じる（#736）。未設定は閉じたまま。
            printf '%s\n' "MEISAI_LAB_CUTOVER=${MEISAI_LAB_CUTOVER:-}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    needs: [tag, deploy]
    if: always()
    runs-on: ubuntu-latest
    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: Asset Manager
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: Asset Manager
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
